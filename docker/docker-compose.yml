# Phase 0 — Foundation stack (healthcheck-gated, pinned images, memory limits)
# Usage (from repo root):
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#
# Ollama runs on the HOST (not in Docker). Install Ollama, pull gemma4:e4b,
# then start it before bring-up. Backend reaches it via host.docker.internal.
#
# Team setup:
#   1. Install Ollama: https://ollama.com/download
#   2. ollama pull gemma4:e4b
#   3. ollama serve   # or open the Ollama desktop app
#   4. docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#
# Project name is fixed so this stack never collides with a sibling folder's
# compose project (Compose defaults project name to the parent directory name,
# which was "docker" and previously attached mounts from Security_Agent).

name: analyst_agent

networks:
  agent-network:
    driver: bridge

volumes:
  elasticsearch-data:

services:

  # ---------------------------------------------------------------
  # Elasticsearch — pinned version, healthcheck, bounded memory
  # ---------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.11.0}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - agent-network

  # ---------------------------------------------------------------
  # MCP Server — official Elastic image, HTTP mode
  # ---------------------------------------------------------------
  mcp-server:
    image: ${MCP_IMAGE:-docker.elastic.co/mcp/elasticsearch:0.4.0}
    container_name: mcp-server
    command: ["http"]
    environment:
      - ES_URL=http://elasticsearch:9200
      - ES_API_KEY=
    ports:
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Official image is Wolfi-based and does NOT include curl/wget.
    # Server is up when the process is running; host can verify: curl localhost:8080/ping → "Ready"
    healthcheck:
      test: ["CMD-SHELL", "pidof elasticsearch-core-mcp-server >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - agent-network

  # ---------------------------------------------------------------
  # Backend — FastAPI skeleton only (/health, /debug). No LangGraph.
  # Ollama is host-side: OLLAMA_URL → host.docker.internal:11434
  # ---------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - MCP_SERVER_URL=http://mcp-server:8080
      - GEMMA_MODEL_TAG=${GEMMA_MODEL_TAG:-gemma4:e4b}
      - LOG_LEVEL=INFO
    # Lets Linux Docker reach the host Ollama process (macOS/Windows Docker Desktop
    # already provides host.docker.internal; this is a no-op / fix for Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ../backend:/app
      - ../data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agent-network

  # ---------------------------------------------------------------
  # Frontend — Next.js skeleton only (status page). Chat UI = Phase 3.
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - agent-network
